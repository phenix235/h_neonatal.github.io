<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neonatal Graph Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 { text-align: center; color: #333; }

        /* 폴더 버튼 스타일 */
        #folder-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .folder-btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .folder-btn:hover { background-color: #0056b3; }
        .folder-btn.active { background-color: #004494; border: 2px solid #002a5c; }

        /* 이미지 그리드 스타일 (nx2 구조) */
        #image-container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 1:1 비율로 2열 배치 */
            gap: 20px;
        }

        .img-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .img-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        .img-name {
            padding: 10px;
            font-size: 14px;
            color: #555;
            background: #f9f9f9;
        }

        .loading { text-align: center; grid-column: span 2; padding: 20px; }
        .error { color: red; text-align: center; grid-column: span 2; }
    </style>
</head>
<body>

    <h1>Neonatal Graphs</h1>

    <div id="folder-container">
        <p>폴더 목록을 불러오는 중...</p>
    </div>

    <div id="image-container">
        </div>

    <script>
        // ==========================================
        // 설정 영역: 사용자 ID와 리포지토리 이름 수정
        // ==========================================
        const OWNER = 'phenix235';
        const REPO = 'neonatal_graph';
        // ==========================================

        const folderContainer = document.getElementById('folder-container');
        const imageContainer = document.getElementById('image-container');

        // 1. 초기 실행: 최상위 폴더 목록 가져오기
        async function fetchFolders() {
            const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
            
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('폴더 정보를 가져오는데 실패했습니다.');
                
                const data = await response.json();
                
                // 폴더(type === 'dir')만 필터링
                const folders = data.filter(item => item.type === 'dir');

                renderFolderButtons(folders);
            } catch (error) {
                folderContainer.innerHTML = `<p class="error">오류 발생: ${error.message}</p>`;
            }
        }

        // 2. 폴더 버튼 렌더링
        function renderFolderButtons(folders) {
            folderContainer.innerHTML = ''; // 초기화

            if (folders.length === 0) {
                folderContainer.innerHTML = '<p>표시할 폴더가 없습니다.</p>';
                return;
            }

            folders.forEach(folder => {
                const btn = document.createElement('button');
                btn.className = 'folder-btn';
                btn.textContent = folder.name;
                
                // 버튼 클릭 이벤트
                btn.onclick = () => {
                    // 모든 버튼에서 active 클래스 제거 후 현재 버튼에 추가
                    document.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    fetchImages(folder.path);
                };

                folderContainer.appendChild(btn);
            });
        }

        // 3. 선택된 폴더 내 이미지 가져오기
        async function fetchImages(path) {
            imageContainer.innerHTML = '<p class="loading">이미지를 불러오는 중입니다...</p>';
            
            const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('이미지 정보를 가져오는데 실패했습니다.');

                const data = await response.json();

                // PNG 파일만 필터링 (대소문자 구분 없이)
                const images = data.filter(item => item.name.toLowerCase().endsWith('.png'));

                renderImages(images);
            } catch (error) {
                imageContainer.innerHTML = `<p class="error">오류 발생: ${error.message}</p>`;
            }
        }

        // 4. 이미지 그리드 렌더링
        function renderImages(images) {
            imageContainer.innerHTML = ''; // 초기화

            if (images.length === 0) {
                imageContainer.innerHTML = '<p style="text-align:center; grid-column: span 2;">이 폴더에는 PNG 이미지가 없습니다.</p>';
                return;
            }

            images.forEach(imgData => {
                const card = document.createElement('div');
                card.className = 'img-card';

                // download_url은 이미지를 직접 볼 수 있는 주소입니다.
                card.innerHTML = `
                    <img src="${imgData.download_url}" alt="${imgData.name}" loading="lazy">
                    <div class="img-name">${imgData.name}</div>
                `;

                imageContainer.appendChild(card);
            });
        }

        // 페이지 로드 시 폴더 목록 실행
        fetchFolders();

    </script>
</body>
</html>
