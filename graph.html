<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Neonatal 3D Rate Graphs (Image Ver)</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 { margin-bottom: 20px; color: #333; }

    /* 버튼 스타일 */
    .controls {
      margin-bottom: 30px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: inline-block;
    }

    .btn {
      padding: 10px 20px;
      margin: 0 10px;
      font-size: 16px;
      border: 2px solid #007bff;
      background-color: white;
      color: #007bff;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover { background-color: #e7f1ff; }
    
    .btn.active {
      background-color: #007bff;
      color: white;
      box-shadow: 0 4px 6px rgba(0,123,255,0.3);
    }

    /* 이미지 배치 */
    .graph-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .image-wrapper {
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 500px; /* 이미지 카드 폭 */
    }

    .image-wrapper img {
      width: 100%;
      height: auto;
      border-radius: 5px;
      display: block;
    }

    .image-title {
      font-weight: bold;
      margin-bottom: 10px;
      display: block;
      color: #555;
      font-size: 1.1em;
    }
  </style>
</head>
<body>

  <h1>3D Death Rate Graphs</h1>

  <div class="controls">
    <button class="btn active" onclick="loadVersion('9pi_weight_graph_ver1', this)">Version 1</button>
    <button class="btn" onclick="loadVersion('9pi_weight_graph_ver2', this)">Version 2</button>
  </div>

  <div class="graph-container">
    
    <div class="image-wrapper">
      <span class="image-title">Positive Surface</span>
      <img id="img-pos" src="" alt="Positive Graph">
    </div>

    <div class="image-wrapper">
      <span class="image-title">Negative Surface</span>
      <img id="img-neg" src="" alt="Negative Graph">
    </div>

    <div class="image-wrapper">
      <span class="image-title">Difference Surface</span>
      <img id="img-diff" src="" alt="Difference Graph">
    </div>

  </div>

  <script>
    // 페이지가 열리면 자동으로 ver1 폴더의 이미지를 로드
    window.onload = function() {
        loadVersion('9pi_weight_graph_ver1', document.querySelector('.btn.active'));
    };

    function loadVersion(folderName, btnElement) {
        // 버튼 활성화 표시 변경
        const buttons = document.querySelectorAll('.btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        btnElement.classList.add('active');

        // 이미지 경로 변경 (폴더명 + / + 파일명)
        // 만약 파일명이 다르다면 여기서 수정해야 합니다.
        document.getElementById('img-pos').src = folderName + '/bdp_Positive_Surface.png';
        document.getElementById('img-neg').src = folderName + '/bdp_Negative_Surface.png';
        document.getElementById('img-diff').src = folderName + '/bdp_Difference_Surface.png';
    }
  </script>

</body>
</html>
