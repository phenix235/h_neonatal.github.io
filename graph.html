<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Repository Graph Viewer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        
        /* 상단 토큰 입력 바 */
        #auth-bar { padding-bottom: 20px; border-bottom: 1px solid #ddd; margin-bottom: 20px; }
        #auth-bar input { width: 300px; padding: 5px; }
        #auth-bar button { padding: 5px 10px; cursor: pointer; }

        /* 메인 레이아웃 */
        #main-container { display: flex; flex-grow: 1; overflow: hidden; }

        /* 왼쪽 사이드바 */
        #folder-list { width: 250px; border-right: 1px solid #ccc; padding-right: 20px; overflow-y: auto; flex-shrink: 0; }
        .folder-item { display: block; width: 100%; padding: 10px; margin-bottom: 5px; text-align: left; background: #f0f0f0; border: none; cursor: pointer; border-radius: 4px; }
        .folder-item:hover { background: #e0e0e0; }
        .folder-item.active { background: #007bff; color: white; }

        /* 오른쪽 이미지 영역 */
        #image-container { flex-grow: 1; padding-left: 20px; overflow-y: auto; }
        .grid-view { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .image-card { border: 1px solid #ddd; padding: 10px; border-radius: 5px; text-align: center; background: #fff; }
        .image-card img { max-width: 100%; height: auto; display: block; margin: 0 auto; }
        .image-name { margin-top: 10px; font-size: 14px; color: #333; word-break: break-all; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <div id="auth-bar">
        <label>GitHub Token: </label>
        <input type="password" id="github-token" placeholder="ghp_... (Personal Access Token)">
        <button onclick="startApp()">불러오기</button>
        <div style="font-size: 12px; color: #666; margin-top: 5px;">
            * Private 리포지토리는 토큰이 필수입니다. 입력한 토큰은 어디에도 저장되지 않습니다.
        </div>
    </div>

    <div id="main-container">
        <div id="folder-list">
            <h3>폴더 목록</h3>
            <div id="folders">토큰 입력 후 불러오기를 눌러주세요.</div>
        </div>

        <div id="image-container">
            <h3 id="current-folder-title">폴더를 선택해주세요</h3>
            <div id="image-grid" class="grid-view"></div>
        </div>
    </div>

    <script>
        const OWNER = 'phenix235';
        const REPO = 'neonatal_graph';
        let USER_TOKEN = '';

        const foldersDiv = document.getElementById('folders');
        const imageGrid = document.getElementById('image-grid');
        const currentFolderTitle = document.getElementById('current-folder-title');

        function startApp() {
            const tokenInput = document.getElementById('github-token').value.trim();
            if (!tokenInput) {
                alert('토큰을 입력해주세요.');
                return;
            }
            USER_TOKEN = tokenInput;
            fetchFolders();
        }

        // 공통 헤더 생성 (인증 포함)
        function getHeaders() {
            return {
                'Authorization': `token ${USER_TOKEN}`,
                'Accept': 'application/vnd.github.v3+json'
            };
        }

        async function fetchFolders() {
            foldersDiv.innerHTML = '로딩 중...';
            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents`, {
                    headers: getHeaders()
                });
                
                if (!response.ok) throw new Error(`접근 실패 (${response.status}): 토큰 권한을 확인하세요.`);
                
                const data = await response.json();
                const folders = data.filter(item => item.type === 'dir');

                foldersDiv.innerHTML = '';
                if (folders.length === 0) {
                    foldersDiv.innerHTML = '폴더가 없습니다.';
                    return;
                }

                folders.forEach(folder => {
                    const btn = document.createElement('button');
                    btn.className = 'folder-item';
                    btn.textContent = folder.name;
                    btn.onclick = () => loadImages(folder.name, folder.path, btn);
                    foldersDiv.appendChild(btn);
                });
            } catch (error) {
                foldersDiv.innerHTML = `<div class="error">${error.message}</div>`;
            }
        }

        async function loadImages(folderName, folderPath, clickedBtn) {
            document.querySelectorAll('.folder-item').forEach(b => b.classList.remove('active'));
            clickedBtn.classList.add('active');
            currentFolderTitle.textContent = `${folderName} / 로딩 중...`;
            imageGrid.innerHTML = '';

            try {
                const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${folderPath}`, {
                    headers: getHeaders()
                });
                if (!response.ok) throw new Error('목록 조회 실패');

                const data = await response.json();
                const imageExtensions = ['.jpg', '.jpeg', '.png', '.gif', '.bmp', '.webp'];
                
                const images = data.filter(item => {
                    return item.type === 'file' && imageExtensions.some(ext => item.name.toLowerCase().endsWith(ext));
                });

                currentFolderTitle.textContent = `${folderName} (${images.length}장)`;

                // Private 이미지는 src URL로 바로 접근 불가 -> Blob으로 다운로드하여 표시
                for (const imgData of images) {
                    const card = document.createElement('div');
                    card.className = 'image-card';
                    card.innerHTML = `<div class="loading">이미지 다운로드 중...</div><div class="image-name">${imgData.name}</div>`;
                    imageGrid.appendChild(card);

                    // 비동기로 이미지 데이터 fetch
                    fetchImageBlob(imgData.download_url, card);
                }

            } catch (error) {
                imageGrid.innerHTML = `<div class="error">${error.message}</div>`;
            }
        }

        async function fetchImageBlob(url, cardElement) {
            try {
                const response = await fetch(url, { headers: getHeaders() });
                if (!response.ok) throw new Error('로드 실패');
                
                const blob = await response.blob();
                const objectURL = URL.createObjectURL(blob);
                
                const img = document.createElement('img');
                img.src = objectURL;
                
                // 로딩 텍스트 제거하고 이미지 삽입
                cardElement.querySelector('.loading')?.remove();
                cardElement.prepend(img);
            } catch (e) {
                cardElement.querySelector('.loading').textContent = 'X';
                cardElement.querySelector('.loading').className = 'error';
            }
        }
    </script>
</body>
</html>
